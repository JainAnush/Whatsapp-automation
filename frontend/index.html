<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Campaign Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>WhatsApp Campaign Dashboard</h1>

      <button id="sendCampaignBtn">Send Campaign</button>

      <h2>Status</h2>
      <div id="statusDashboard">
        <p>
          Campaign Status: <span id="campaignStatus">Waiting to send...</span>
        </p>
        <p>Total Leads Sent: <span id="leadsSent">0</span></p>
        <p>Failed Messages: <span id="failedMessages">0</span></p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
